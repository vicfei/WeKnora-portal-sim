{{define "begin"}}<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · v2 门户</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#24292f}
.nav{display:flex;gap:16px;align-items:center;background:#1f2733;color:#fff;padding:10px 24px}
.nav a{color:#cbd5e1;text-decoration:none}.nav a:hover{color:#fff}.nav .on{color:#fff;font-weight:600}
.brand{font-weight:700;color:#fff!important}.spacer{flex:1}.who{color:#94a3b8;font-size:13px}
.container{max-width:1080px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:16px 20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kb{display:block;color:inherit;text-decoration:none}.kb:hover{border-color:#3b82f6}
.kb-name{font-weight:600}.kb-desc{color:#6b7280;font-size:13px;margin:4px 0}.kb-meta{font-size:12px;color:#94a3b8}
.muted{color:#94a3b8}.centered{text-align:center;padding:40px 0}
button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
button.primary{background:#2563eb;border-color:#2563eb;color:#fff}button.primary:hover{background:#1d4ed8}
button.link{border:none;background:none;color:#cbd5e1;padding:0}
input,select{border:1px solid #cbd5e1;border-radius:8px;padding:7px 10px;background:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.inline{display:inline}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef1f5;font-size:13px}th{color:#64748b;font-weight:600}
.completed{color:#16a34a}.pending,.parsing{color:#d97706}.failed{color:#dc2626}
.group{margin-bottom:20px}.group h3{margin:8px 0}.count{background:#eef2ff;color:#4f46e5;border-radius:10px;padding:1px 8px;font-size:12px;margin-left:8px}
.role{font-size:11px;border-radius:999px;padding:1px 8px;margin-left:6px}
.role.owner{background:#fef3c7;color:#92400e}.role.admin{background:#fee2e2;color:#b91c1c}.role.contributor{background:#dbeafe;color:#1d4ed8}.role.viewer{background:#f1f5f9;color:#475569}
.search-hit{padding:10px;border-bottom:1px solid #f1f5f9}.search-hit b{color:#b45309}
.chat-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px}.side ul{list-style:none;padding:0;margin:12px 0 0}
.side li{padding:6px 0;border-bottom:1px solid #f1f5f9}.side a{color:#2563eb;text-decoration:none}
.chat-main{display:flex;flex-direction:column;height:70vh}.messages{flex:1;overflow-y:auto;padding:12px;background:#fafbfc;border:1px solid #eef1f5;border-radius:8px;margin:10px 0}
.msg{margin:8px 0}.msg.user{color:#1d4ed8}.msg.bot{white-space:pre-wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #cbd5e1;border-radius:999px;padding:3px 10px}
.wide{width:100%}.foot{text-align:center;color:#94a3b8;font-size:12px;margin:20px 0}
.tag-v2{background:#dcfce7;color:#166534;font-size:11px;border-radius:999px;padding:1px 8px;margin-left:8px}
</style>
</head>
<body>
{{end}}

{{define "topnav"}}<nav class="nav">
  <a class="brand" href="/kb">v2 门户</a>
  <a href="/kb" class="{{if eq .Title "知识库门户"}}on{{end}}">知识库</a>
  <a href="/chat" class="{{if eq .Title "知识问答"}}on{{end}}">问答</a>
  <a href="/admin">管理后台</a>
  <span class="spacer"></span>
  <span class="who">{{.UserName}}</span>
  <form method="post" action="/logout" class="inline"><button class="link">退出</button></form>
</nav>{{end}}

{{define "end"}}<footer class="foot">v2 架构：B1 皮 + WeKnora 芯（本服务零权限逻辑，一切裁决在平台侧）</footer>
</body>
</html>{{end}}
