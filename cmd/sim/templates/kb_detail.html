{{template "begin" .}}{{template "topnav" .}}
<main class="container">
<div class="row" style="justify-content:space-between">
  <h2 id="kbname" style="margin:4px 0">加载中…</h2>
  <a href="/kb" class="muted">← 返回列表</a>
</div>
<div id="kbmeta" class="muted"></div>
<div class="card">
  <div class="row">
    <input id="q" placeholder="检索本知识库…" style="flex:1">
    <button class="primary" onclick="doSearch()">检索</button>
    <span id="upwrap" hidden>
      <input type="file" id="upfile" accept=".pdf,.docx,.txt,.md">
      <button type="button" onclick="doUpload()">上传文档</button>
      <span id="upmsg" class="muted"></span>
    </span>
  </div>
</div>
<div id="results"></div>
<div class="card">
  <h3>文档列表</h3>
  <table><thead><tr><th>标题</th><th>类型</th><th>解析状态</th></tr></thead><tbody id="doctable"><tr><td colspan="3" class="muted">加载中…</td></tr></tbody></table>
</div>
</main>
<script>
const KB_ID = '{{.KbID}}';
const ROLE_LABEL = {owner:'本人', admin:'空间管理员', contributor:'可编辑', viewer:'只读'};
const EDITABLE = ['owner','admin','contributor'];
async function jget(u){ const r=await fetch(u); const j=await r.json(); if(!r.ok||j.success===false) throw new Error(j.error?.message||r.status); return j.data; }
(async () => {
  try {
    const kb = await jget('/api/v1/knowledge-bases/'+KB_ID);
    document.getElementById('kbname').textContent = kb.name;
    document.getElementById('kbmeta').textContent =
      `${kb.tenant_name||''} · ${kb.knowledge_count??0} 篇文档 · 我的角色：${ROLE_LABEL[kb.my_role]||kb.my_role||'—'}`;
    // 上传入口仅按 my_role 做展示提示；真正拦截由 WeKnora 侧执行
    if (EDITABLE.includes(kb.my_role)) document.getElementById('upwrap').hidden = false;
  } catch (e) {
    document.getElementById('kbname').textContent = '无法访问该知识库（' + e.message + '）';
    return;
  }
  try {
    const docs = await jget(`/api/v1/knowledge-bases/${KB_ID}/knowledge?page=1&page_size=50`);
    document.getElementById('doctable').innerHTML = (Array.isArray(docs)?docs:[])
      .map(d=>`<tr><td>${d.title}</td><td>${d.type||''}</td><td class="${d.parse_status}">${d.parse_status}</td></tr>`).join('')
      || '<tr><td colspan="3" class="muted">（空）</td></tr>';
  } catch (e) { document.getElementById('doctable').innerHTML = `<tr><td colspan="3" class="muted">文档列表加载失败：${e.message}</td></tr>`; }
})();
async function doSearch(){
  const q = document.getElementById('q').value.trim(); if(!q) return;
  const box = document.getElementById('results'); box.innerHTML = '<div class="card muted">检索中…</div>';
  try {
    const r = await fetch(`/api/v1/knowledge-bases/${KB_ID}/hybrid-search`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query_text:q, match_count:5})});
    const j = await r.json(); if(!r.ok||j.success===false) throw new Error(j.error?.message||r.status);
    const hits = j.data||[];
    box.innerHTML = hits.length ? '<div class="card">'+hits.map(h=>`<div class="search-hit"><b>${h.title||''}</b>
      <div class="muted">${(h.content||'').slice(0,240)}…</div><div>score: ${(h.score??0).toFixed(3)}</div></div>`).join('')+'</div>'
      : '<div class="card muted">无结果</div>';
  } catch(e){ box.innerHTML = `<div class="card" style="color:#dc2626">检索失败：${e.message}</div>`; }
}
async function doUpload(){
  const f = document.getElementById('upfile').files[0]; const msg = document.getElementById('upmsg');
  if(!f){ msg.textContent='请先选择文件'; return; }
  msg.textContent='上传中…';
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch(`/api/v1/knowledge-bases/${KB_ID}/knowledge/file`, {method:'POST', body: fd});
  const j = await r.json().catch(()=>({}));
  msg.textContent = (r.ok && j.success!==false) ? '已提交，解析进行中' : '失败：'+(j.error?.message||r.status);
  if (r.ok && j.success!==false) setTimeout(()=>location.reload(), 1500);
}
</script>
{{template "end" .}}
